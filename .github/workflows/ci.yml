---
name: CI Pipeline
on:
  push:
    branches:
      - main
jobs:
  validate-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate docker compose
        run: docker compose config

      - name: Validate Prometheus config
        run: |
          docker run --rm \
            -v $(pwd)/prometheus:/etc/prometheus \
            --entrypoint promtool \
            prom/prometheus \
            check config /etc/prometheus/prometheus.yml

      - name: Validate Prometheus rules
        run: |
          docker run --rm \
            -v $(pwd)/prometheus:/etc/prometheus \
            --entrypoint promtool \
            prom/prometheus \
            check rules /etc/prometheus/alert.rules.yml

      - name: Build containers
        run: docker compose build

      - name: Install linters
        run: >
          sudo apt-get install -y yamllint &&
          URL=https://github.com/hadolint/hadolint/releases/latest/download &&
          curl -sSL "$URL/hadolint-Linux-x86_64" -o /usr/local/bin/hadolint &&
          chmod +x /usr/local/bin/hadolint &&
          npm install --global eslint prettier

      - name: Lint YAML files
        run: yamllint .

      - name: Lint Dockerfile
        run: |
          hadolint monitorin-app/alert-receiver/Dockerfile
          hadolint monitorin-app/node-app/Dockerfile

      - name: Lint JS/TS files
        run: eslint .

      - name: Format check with Prettier
        run: prettier --check .

      - name: Start containers
        run: docker compose up -d

      - name: Check /metrics endpoint
        run: curl -f http://localhost:9090/metrics

      - name: Check Prometheus targets
        run: curl -f http://localhost:9090/api/v1/targets | grep '"health":"up"'

      - name: Check Grafana login page
        run: curl -f http://localhost:3000/login
