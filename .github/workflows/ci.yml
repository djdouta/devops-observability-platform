---
name: CI Pipeline
on:
  push:
    branches:
      - main
jobs:
  validate-and-build:
    runs-on: ubuntu-latest

    env:
      SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate docker compose
        run: docker compose config

      - name: Validate Prometheus config
        run: |
          docker run --rm \
            -v $(pwd)/prometheus:/etc/prometheus \
            --entrypoint promtool \
            prom/prometheus \
            check config /etc/prometheus/prometheus.yml

      - name: Validate Prometheus rules
        run: |
          docker run --rm \
            -v $(pwd)/prometheus:/etc/prometheus \
            --entrypoint promtool \
            prom/prometheus \
            check rules /etc/prometheus/alert.rules.yml

      - name: Build containers
        run: docker compose build

      - name: Install linters
        run: >
          sudo apt-get install -y yamllint &&
          URL=https://github.com/hadolint/hadolint/releases/latest/download &&
          curl -sSL "$URL/hadolint-Linux-x86_64" -o /usr/local/bin/hadolint &&
          chmod +x /usr/local/bin/hadolint &&
          npm install --global eslint prettier

      - name: Lint YAML files
        run: yamllint .

      - name: Lint Dockerfile
        run: |
          hadolint ./monitoring-app/alert-receiver/Dockerfile
          hadolint ./monitoring-app/node-app/Dockerfile

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint JS/TS files
        run: npx eslint .

      - name: Format check with Prettier
        run: prettier --check .

      - name: Create external Prometheus volume
        run: |
          docker volume create observability-stack_node-logs
          docker volume create observability-stack_grafana-data
          docker volume create observability-stack_loki-data
          docker volume create observability-stack_prometheus-data
          docker volume create observability-stack_alertmanager-data

      - name: Build and run containers
        run: |
          docker compose up -d --build

      - name: Check /metrics endpoint
        run: curl -f http://localhost:9090/metrics

      - name: Check Prometheus targets
        run: |
          for i in {1..5}; do
            TARGETS=$(curl -s http://localhost:9090/api/v1/targets)
            echo "$TARGETS" | grep '"health":"up"' && exit 0
            echo "Targets not ready yet, retrying..."
            sleep 5
          done
          echo "Prometheus targets did not come up healthy"
          exit 1

      - name: Check Grafana login page
        run: curl -f http://localhost:3000/login
