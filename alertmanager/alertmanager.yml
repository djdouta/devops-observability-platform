global:
  resolve_timeout: 5m

route:
  receiver: "default"
  group_by: ["alertname"]
  group_wait: 10s
  group_interval: 5m
  repeat_interval: 6h

  routes:
    - match:
        severity: critical
      receiver: "critical-webhook"
      group_wait: 5s
      continue: false

    - match:
        severity: warning
      receiver: "warning-webhook"
      group_wait: 20s
      continue: false

receivers:
  - name: "default"
    webhook_configs:
      - url: "http://alert-receiver:5001/alerts"

  - name: "critical-webhook"
    webhook_configs:
      - url: "http://alert-receiver:5001/critical"

  - name: "warning-webhook"
    webhook_configs:
      - url: "http://alert-receiver:5001/warning"

inhibit_rules:
  - source_match:
      alertname: ServiceDown
    target_match:
      severity: warning
    equal: ["job"]
