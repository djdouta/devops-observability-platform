---
services:
  k6:
    image: grafana/k6
    volumes:
      - ./k6:/scripts
    command: run /scripts/load-test.js
    depends_on:
      node-app:
        condition: service_healthy
    networks:
      - observability
  node-app:
    build:
      context: ./monitoring-app/node-app
      dockerfile: Dockerfile
    init: true
    ports:
      - '3000:3000'
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://localhost:3000/metrics']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    volumes:
      - node-logs:/var/log
    networks:
      - observability
    restart: always
  alert-receiver:
    build:
      context: ./monitoring-app/alert-receiver
      dockerfile: Dockerfile
    ports:
      - '5001:5001'
    environment:
      SLACK_WEBHOOK: ${SLACK_WEBHOOK}
    networks:
      - observability
    restart: unless-stopped
  prometheus:
    image: prom/prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./prometheus/alert.rules.yml:/etc/prometheus/alert.rules.yml
      - prometheus-data:/prometheus
    ports:
      - '9090:9090'
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://localhost:9090/-/healthy']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      - alertmanager
    networks:
      - observability
    restart: unless-stopped
  alertmanager:
    image: prom/alertmanager
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml
      - alertmanager-data:/alertmanager
    ports:
      - '9093:9093'
    networks:
      - observability
    restart: unless-stopped
  loki:
    image: grafana/loki
    ports:
      - '3100:3100'
    volumes:
      - loki-data:/loki
      - ./loki/loki-config.yml:/etc/loki/local-config.yaml
    command: -config.file=/etc/loki/local-config.yaml
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://localhost:3100/ready']
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - observability
    restart: unless-stopped
  alloy:
    image: grafana/alloy:latest
    restart: unless-stopped
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy
      - /var/run/docker.sock:/var/run/docker.sock
      - node-logs:/var/log/node-app:ro
    command:
      - run
      - /etc/alloy/config.alloy
      - --server.http.listen-addr=0.0.0.0:12345
    ports:
      - '12345:12345'
    networks:
      - observability
  grafana:
    image: grafana/grafana
    ports:
      - '3001:3000'
    volumes:
      - grafana-data:/var/lib/grafana
    healthcheck:
      test:
        ['CMD', 'wget', '--spider', '-q', 'http://localhost:3000/api/health']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - observability
    restart: unless-stopped
volumes:
  node-logs:
    external: true
    name: observability-stack_node-logs
  grafana-data:
    external: true
    name: observability-stack_grafana-data
  loki-data:
    external: true
    name: observability-stack_loki-data
  prometheus-data:
    external: true
    name: observability-stack_prometheus-data
  alertmanager-data:
    external: true
    name: observability-stack_alertmanager-data
networks:
  observability:
    driver: bridge
