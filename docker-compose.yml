---
services:
  k6:
    image: grafana/k6
    volumes:
      - ./k6:/scripts
    command: run /scripts/load-test.js
    depends_on:
      node-app:
        condition: service_healthy
    networks:
      - observability

  node-app:
    build:
      context: ./apps/node-app
      dockerfile: Dockerfile
    init: true
    ports:
      - '3000:3000'
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://localhost:3000/metrics']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    # ✅ Sin volumen node-logs: los logs van a stdout y Alloy los captura
    networks:
      - observability
    restart: always

  alert-receiver:
    build:
      context: ./apps/alert-receiver
      dockerfile: Dockerfile
    ports:
      - '5001:5001'
    environment:
      SLACK_WEBHOOK: ${SLACK_WEBHOOK}
    networks:
      - observability
    restart: unless-stopped

  prometheus:
    image: prom/prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./prometheus/alert.rules.yml:/etc/prometheus/alert.rules.yml
      - prometheus-data:/prometheus
    ports:
      - '9090:9090'
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://localhost:9090/-/healthy']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      - alertmanager
    networks:
      - observability
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml
      - alertmanager-data:/alertmanager
    ports:
      - '9093:9093'
    networks:
      - observability
    restart: unless-stopped

  loki:
    image: grafana/loki:latest
    ports:
      - '3100:3100'
      - '9095:9095'
    volumes:
      - loki-data:/loki
      - ./loki/loki-config.yml:/etc/loki/local-config.yaml
      - ./loki/wal:/loki/wal
    command: -config.file=/etc/loki/local-config.yaml
    healthcheck:
      disable: true
    networks:
      - observability
    restart: unless-stopped

  alloy:
    image: grafana/alloy:latest
    restart: unless-stopped
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    command:
      - run
      - /etc/alloy/config.alloy
      - --server.http.listen-addr=0.0.0.0:12345
    ports:
      - '12345:12345'
    depends_on:
      loki:
        condition: service_started
    networks:
      - observability

  grafana:
    image: grafana/grafana:latest
    ports:
      - '3001:3000'
    volumes:
      - grafana-data:/var/lib/grafana
    healthcheck:
      test:
        ['CMD', 'wget', '--spider', '-q', 'http://localhost:3000/api/health']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - observability
    restart: unless-stopped

volumes:
  grafana-data:
  loki-data:
  prometheus-data:
  alertmanager-data:

networks:
  observability:
    driver: bridge
